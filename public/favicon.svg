<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <style>
    :root {
      color-scheme: light dark;
    }
    .adaptive-icon {
      filter: none;
    }
    @media (prefers-color-scheme: dark) {
      .adaptive-icon {
        filter: invert(1);
      }
    }
  </style>
  <image class="adaptive-icon" width="512" height="512" href="data:image/png;base64," />
</svg>
